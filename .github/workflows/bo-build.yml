name: Bo - Build AzerothCore Binary

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击触发编译

jobs:
  build:
    runs-on: ubuntu-22.04
    # 核心改动：直接在预建好的自定义镜像容器中运行编译
    container:
      image: ghcr.io/${{ github.repository }}/ac-builder:22.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.TESTPAT }}

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/ac-dist \
            -DDCMAKE_C_COMPILER=/usr/bin/clang \
            -DDCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DTOOLS_BUILD=all \
            -DSCRIPTS=static

      - name: Build Core
        run: |
          cd build
          # 使用 CPU 核心数加速并行编译
          make -j$(nproc)

      - name: Install Core to Staging
        run: |
          cd build
          make install

      - name: Prepare Deployment Package
        run: |
          # 复制数据库文件到发布目录
          mkdir -p $GITHUB_WORKSPACE/ac-dist/data/sql
          cp -r data/sql/* $GITHUB_WORKSPACE/ac-dist/data/sql/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azerothcore-binaries-ubuntu2204
          path: $GITHUB_WORKSPACE/ac-dist
          retention-days: 7
