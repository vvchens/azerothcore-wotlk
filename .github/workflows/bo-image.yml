name: Bo - Build AzerothCore Builder Image

on:
  workflow_dispatch: # 仅支持手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write # 赋予写入 GHCR 权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 在工作区动态创建一个真实的 Dockerfile 文件
      - name: Create Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y \
            git cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev patchelf zip \
            && rm -rf /var/lib/apt/lists/*
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/ac-builder:22.04