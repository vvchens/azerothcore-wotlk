name: Wiki Build Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND="noninteractive" apt-get install -y \
            git cmake make gcc g++ clang \
            libssl-dev libbz2-dev libreadline-dev libncurses-dev \
            libboost-all-dev libace-dev libunwind-dev libgoogle-perftools-dev \
            mysql-server libmysqlclient-dev

      - name: Setup Environment Variables
        run: |
          echo "AC_CODE_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "BUILD_CORES=$(nproc)" >> $GITHUB_ENV

      - name: Create Build Directory
        run: |
          mkdir -p $AC_CODE_DIR/build
          cd $AC_CODE_DIR/build

      - name: Configure CMake
        run: |
          cd $AC_CODE_DIR/build
          cmake ../ \
            -DCMAKE_INSTALL_PREFIX=$AC_CODE_DIR/env/dist/ \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DWITH_WARNINGS=1 \
            -DTOOLS_BUILD=all \
            -DSCRIPTS=static \
            -DMODULES=static

      - name: Build Core
        run: |
          cd $AC_CODE_DIR/build
          make -j${BUILD_CORES}

      - name: Install Core
        run: |
          cd $AC_CODE_DIR/build
          make install

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
  
      # ---------------------------
      # 1. Cache vcpkg (节省 30 分钟)
      # ---------------------------
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
  
      # ---------------------------
      # 2. Cache CMake deps (_deps)
      # ---------------------------
      - name: Cache CMake deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-
  
      # ---------------------------
      # 3. Cache build/ (增量编译)
      # ---------------------------
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            build-${{ runner.os }}-
  
      # ---------------------------
      # 4. Install Dependencies
      # ---------------------------
      - name: Install Dependencies
        run: |
          vcpkg install openssl:x64-windows
          vcpkg install mysql-connector-c:x64-windows
          vcpkg install boost:x64-windows
          vcpkg install ace:x64-windows
  
      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "AC_CODE_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "BUILD_CORES=$(nproc)" >> $GITHUB_ENV
  
      - name: Create Build Directory
        run: |
          mkdir build
          cd build
  
      - name: Configure CMake
        shell: cmd
        run: |
          cd build
          cmake ../ -A x64 ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%/env/dist/" ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" ^
            -DWITH_WARNINGS=1 ^
            -DTOOLS_BUILD=all ^
            -DSCRIPTS=static ^
            -DMODULES=static
  
      - name: Build Core
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release --parallel %BUILD_CORES%
  
      - name: Install Core
        shell: cmd
        run: |
          cd build
          cmake --install . --config Release

